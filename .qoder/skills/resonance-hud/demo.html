<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance HUD · Component Gallery</title>
<style>
  /* ===== Design tokens (see SKILL.md) ===== */
  :root {
    --gold:        #c9ac67;
    --gold-bright: #e6cf95;
    --gold-dim:    rgba(201, 172, 103, .3);
    --cream:       #fafae9;
    --cream-dim:   rgba(250, 250, 233, .45);
    --bg-0: #14161a;
    --bg-1: #1b1e23;
    --card: rgba(255, 255, 255, .035);
    --hair: rgba(201, 172, 103, .2);
    --theme: #d9b45c;
    --ease:  cubic-bezier(.32,.72,.24,1);
    --latin: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  body {
    min-height: 100vh;
    background: #0d0e11;
    color: var(--cream);
    font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    display: flex; justify-content: center;
    padding: 32px 20px 60px;
  }
  .stage { width: 100%; max-width: 420px; }
  .stage > h2 {
    font: 400 9px/1 var(--latin);
    letter-spacing: 3px; color: var(--gold-dim);
    margin: 26px 0 9px;
  }
  .stage > h2:first-child { margin-top: 0; }

  /* ===== Panel base ===== */
  .panel {
    position: relative;
    background:
      radial-gradient(130% 80% at 100% 0%, rgba(201,172,103,.11), transparent 62%),
      linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg,
      rgba(255,255,255,.022) 0 1px, transparent 1px 5px);
    pointer-events: none;
  }
  .panel::after {
    content: '';
    position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, var(--gold), rgba(201,172,103,.35));
    pointer-events: none; z-index: 3;
  }
  .panel-body { position: relative; padding: 0 16px 14px; }

  /* ===== Title bar ===== */
  .titlebar {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 8px 9px 16px;
  }
  .diamond {
    width: 9px; height: 9px; flex: none;
    background: var(--gold); transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(201,172,103,.7);
  }
  .titlebar .tt { flex: 1; line-height: 1.15; }
  .titlebar .tt b { font-size: 12.5px; font-weight: 600; letter-spacing: 1px; }
  .titlebar .tt i {
    display: block; font-style: normal;
    font: 400 8.5px/1 var(--latin);
    letter-spacing: 2.4px; color: var(--gold-dim); margin-top: 2px;
  }
  .titlebar .close {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--cream-dim); transition: all .15s var(--ease);
  }
  .titlebar .close:hover { color: #ff6b5e; background: rgba(255,107,94,.12); }

  /* ===== Page header ===== */
  .head { padding: 2px 2px 14px; }
  .head h1 { font-size: 24px; font-weight: 700; letter-spacing: 3px; line-height: 1.2; }
  .head .sub { font: 400 9px/1 var(--latin); letter-spacing: 3.4px; color: var(--gold); margin-top: 5px; }
  .head .state {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--cream-dim); margin-top: 9px;
  }
  .head .state s {
    width: 4px; height: 4px; background: #6ee7a0;
    transform: rotate(45deg); text-decoration: none;
    box-shadow: 0 0 6px #6ee7a0;
  }

  /* ===== Card + corner brackets ===== */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--hair);
    padding: 13px 14px; margin-bottom: 9px;
  }
  .card::before, .card::after {
    content: ''; position: absolute;
    width: 9px; height: 9px;
    border-color: var(--gold); pointer-events: none;
  }
  .card::before { left: -1px;  top: -1px;    border-top: 1.5px solid; border-left: 1.5px solid; }
  .card::after  { right: -1px; bottom: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  /* ===== Bilingual section header ===== */
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-head .mk { width: 3px; height: 12px; background: var(--gold); flex: none; }
  .card-head .zh { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
  .card-head .ln { flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-dim), transparent); }
  .card-head .en { font: 400 8.5px/1 var(--latin); letter-spacing: 2.2px; color: var(--gold-dim); }

  /* ===== Item picker ===== */
  .picker {
    display: flex; gap: 9px; overflow-x: auto;
    padding: 6px 4px 12px; margin: -6px -4px -12px;
    scrollbar-width: none;
  }
  .picker::-webkit-scrollbar { display: none; }
  .item {
    position: relative; flex: none;
    width: 84px; padding: 6px 6px 7px;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.07);
    text-align: center; transition: all .2s var(--ease);
  }
  .item:hover { transform: translateY(-2px); border-color: rgba(201,172,103,.4); }
  .item.active {
    border-color: var(--gold);
    background: rgba(201,172,103,.1);
    box-shadow: 0 0 0 1px rgba(201,172,103,.25), 0 6px 18px rgba(0,0,0,.5);
  }
  .item .cn { position: absolute; width: 7px; height: 7px; border-color: var(--gold-bright); opacity: 0; transition: opacity .2s; }
  .item.active .cn { opacity: 1; }
  .item .cn:nth-of-type(1) { left: -1px;  top: -1px;    border-top: 1.5px solid;    border-left: 1.5px solid; }
  .item .cn:nth-of-type(2) { right: -1px; top: -1px;    border-top: 1.5px solid;    border-right: 1.5px solid; }
  .item .cn:nth-of-type(3) { left: -1px;  bottom: -1px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .item .cn:nth-of-type(4) { right: -1px; bottom: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }
  .item .thumb {
    height: 72px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(180deg, transparent 60%, rgba(0,0,0,.5)),
      linear-gradient(165deg, color-mix(in srgb, var(--c, var(--theme)) 32%, #12141a), #12141a);
  }
  /* Placeholder glyph — real projects put an <img> here */
  .item .thumb span {
    font: 700 26px/1 var(--latin);
    color: color-mix(in srgb, var(--c, var(--theme)) 70%, #fff);
    opacity: .55;
  }
  .item .nm {
    font-size: 11.5px; letter-spacing: .5px; margin-top: 6px;
    color: var(--cream-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item.active .nm { color: var(--cream); font-weight: 600; }

  /* ===== Readout + slider ===== */
  .val-row { display: flex; align-items: flex-end; justify-content: space-between; margin: -2px 0 2px; }
  .readout {
    font: 700 32px/1 var(--latin);
    color: var(--gold-bright); letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(201,172,103,.45);
  }
  .readout small { font-size: 13px; margin-left: 2px; color: var(--gold-dim); }
  .val-row .hint { font: 400 8.5px/1 var(--latin); letter-spacing: 2px; color: var(--cream-dim); padding-bottom: 3px; }

  .slider-box { padding: 8px 0 4px; }
  input[type=range] {
    width: 100%; height: 22px;
    -webkit-appearance: none; background: transparent;
    display: block; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    background:
      linear-gradient(90deg, var(--gold), var(--gold-bright)) 0/var(--pct, 50%) 100% no-repeat,
      rgba(255,255,255,.1);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px; margin-top: -4px;
    background: var(--gold-bright); border: none;
    transform: rotate(45deg);
    box-shadow: 0 0 10px rgba(201,172,103,.85);
    transition: box-shadow .12s var(--ease);
  }
  input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 16px rgba(230,207,149,1); }
  .ticks {
    display: flex; justify-content: space-between;
    font: 400 9px/1 var(--latin); letter-spacing: 1.2px;
    color: var(--cream-dim); margin-top: 2px;
  }

  /* ===== Segmented control ===== */
  .seg {
    position: relative;
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin-top: 11px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(0,0,0,.25);
  }
  .seg .pill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 25%;
    background: rgba(201,172,103,.18);
    border-bottom: 1.5px solid var(--gold);
    transform: translateX(calc(var(--i, 0) * 100%));
    transition: transform .28s var(--ease), opacity .18s;
    pointer-events: none;
  }
  .seg button {
    position: relative; padding: 6px 0;
    font-size: 12.5px; letter-spacing: 1px;
    color: var(--cream-dim); transition: color .18s var(--ease);
  }
  .seg button:hover { color: var(--cream); }
  .seg button.active { color: var(--gold-bright); font-weight: 600; }

  /* ===== Switch row ===== */
  .row { display: flex; align-items: center; gap: 11px; }
  .icoframe {
    width: 34px; height: 34px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    background: rgba(201,172,103,.1);
    border: 1px solid var(--gold-dim);
    /* Chamfer: the border is clipped with the box, so it traces the diagonal */
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  .row .txt { flex: 1; min-width: 0; }
  .row .name { font-size: 13.5px; font-weight: 600; letter-spacing: 1px; }
  .row .desc { font-size: 11px; color: var(--cream-dim); }
  .switch {
    position: relative; flex: none;
    width: 44px; height: 20px;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(255,255,255,.14);
    transition: all .2s var(--ease);
  }
  .switch::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 14px;
    background: rgba(250,250,233,.5);
    transition: transform .2s var(--ease), background .2s;
    /* Slanted knob — solid fill defines its own edge */
    clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
  }
  .switch[aria-checked="true"] {
    border-color: var(--gold);
    background: rgba(201,172,103,.2);
    box-shadow: 0 0 12px rgba(201,172,103,.3);
  }
  .switch[aria-checked="true"]::after { transform: translateX(22px); background: var(--gold-bright); }

  /* ===== Divider with node ===== */
  .divider {
    position: relative; height: 1px; margin: 12px 0;
    background: linear-gradient(90deg, transparent, var(--hair) 20%, var(--hair) 80%, transparent);
  }
  .divider::after {
    content: '';
    position: absolute; left: 50%; top: -2.5px;
    width: 5px; height: 5px; margin-left: -2.5px;
    background: var(--gold-dim); transform: rotate(45deg);
  }

  /* ===== Footer ornament ===== */
  .foot {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    padding-top: 10px;
    font: 400 8.5px/1 var(--latin);
    letter-spacing: 2px; color: var(--cream-dim);
  }
  .dots {
    display: grid;
    grid-template-columns: 2px 2px; grid-template-rows: 2px 2px 2px;
    gap: 1.5px; opacity: .55;
  }
  .dots i { background: var(--gold); }
  .dots.mirror { transform: scaleX(-1); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="stage">

  <h2>FULL PANEL</h2>
  <div class="panel">
    <div class="titlebar">
      <span class="diamond"></span>
      <span class="tt"><b>共鸣终端</b><i>RESONANCE TERMINAL</i></span>
      <button class="close" aria-label="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="panel-body">
      <div class="head">
        <h1 id="hName">主体·甲</h1>
        <div class="sub" id="hSub">RESONATOR / ACTIVE</div>
        <div class="state"><s></s>参数即时同步 · 自动写入配置</div>
      </div>

      <!-- Item picker -->
      <section class="card">
        <div class="card-head">
          <span class="mk"></span><span class="zh">共鸣者</span>
          <span class="ln"></span><span class="en">RESONATOR</span>
        </div>
        <div class="picker" id="picker"></div>
      </section>

      <!-- Readout + slider + segmented -->
      <section class="card">
        <div class="card-head">
          <span class="mk"></span><span class="zh">显形尺度</span>
          <span class="ln"></span><span class="en">SCALE</span>
        </div>
        <div class="val-row">
          <span class="readout" id="val">100<small>%</small></span>
          <span class="hint">30 — 150</span>
        </div>
        <div class="slider-box">
          <input id="scale" type="range" min="30" max="150" step="1" value="100">
        </div>
        <div class="ticks"><span>30</span><span>90</span><span>150</span></div>
        <div class="seg">
          <span class="pill"></span>
          <button data-v="50">小</button>
          <button data-v="75">中</button>
          <button data-v="100">默认</button>
          <button data-v="130">大</button>
        </div>
      </section>

      <!-- Switch rows separated by a node divider -->
      <section class="card">
        <div class="row">
          <span class="icoframe">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.9 2.6 2.5 4.2 5 5-2.5.8-4.1 2.4-5 5-.9-2.6-2.5-4.2-5-5 2.5-.8 4.1-2.4 5-5Z"/><path d="M5 15c.4 1.3 1.2 2.1 2.5 2.5C6.2 17.9 5.4 18.7 5 20c-.4-1.3-1.2-2.1-2.5-2.5C3.8 17.1 4.6 16.3 5 15Z"/></svg>
          </span>
          <span class="txt">
            <div class="name">星光特效</div>
            <div class="desc">周围环绕闪烁的粒子</div>
          </span>
          <button class="switch" role="switch" aria-checked="true" aria-label="星光特效"></button>
        </div>
        <div class="divider"></div>
        <div class="row">
          <span class="icoframe">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20v-4"/></svg>
          </span>
          <span class="txt">
            <div class="name">性能模式</div>
            <div class="desc">空闲时降低刷新率</div>
          </span>
          <button class="switch" role="switch" aria-checked="false" aria-label="性能模式"></button>
        </div>
      </section>

      <div class="foot">
        <span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        ESC TO CLOSE · DRAG TO MOVE
        <span class="dots mirror"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>

  <h2>ISOLATED PIECES</h2>
  <div class="panel">
    <div class="panel-body" style="padding-top:16px">
      <section class="card">
        <div class="card-head">
          <span class="mk"></span><span class="zh">节点与读数</span>
          <span class="ln"></span><span class="en">NODES</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <span class="diamond"></span>
          <span class="readout">42<small>°C</small></span>
          <span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="icoframe">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
          </span>
        </div>
      </section>
    </div>
  </div>

</div>

<script>
  /* ===== Item picker ===== */
  const ITEMS = [
    { id: 'a', name: '主体·甲', en: 'RESONATOR / ACTIVE', color: '#d9b45c', glyph: 'A' },
    { id: 'b', name: '主体·青', en: 'RESONATOR / AZURE',  color: '#5aa9d6', glyph: 'B' },
    { id: 'c', name: '主体·赤', en: 'RESONATOR / CRIMSON', color: '#d16a5e', glyph: 'C' }
  ];
  const picker = document.getElementById('picker');
  let cur = 'a';

  function renderPicker() {
    picker.innerHTML = '';
    ITEMS.forEach((it) => {
      const el = document.createElement('button');
      el.className = 'item' + (it.id === cur ? ' active' : '');
      el.style.setProperty('--c', it.color);   // per-item tint; global gold unaffected
      el.innerHTML =
        '<span class="cn"></span><span class="cn"></span><span class="cn"></span><span class="cn"></span>' +
        '<div class="thumb"><span>' + it.glyph + '</span></div>' +
        '<div class="nm">' + it.name + '</div>';
      el.onclick = () => {
        cur = it.id;
        document.documentElement.style.setProperty('--theme', it.color);
        document.getElementById('hName').textContent = it.name;
        document.getElementById('hSub').textContent = it.en;
        renderPicker();
      };
      picker.appendChild(el);
    });
  }
  renderPicker();

  /* ===== Readout + slider + segmented ===== */
  const slider = document.getElementById('scale');
  const val = document.getElementById('val');
  const segBtns = Array.from(document.querySelectorAll('.seg button'));
  const pill = document.querySelector('.seg .pill');

  function render(pct) {
    val.innerHTML = pct + '<small>%</small>';
    slider.style.setProperty('--pct', ((pct - 30) / 120 * 100) + '%');
    const i = segBtns.findIndex((b) => Number(b.dataset.v) === pct);
    segBtns.forEach((b, n) => b.classList.toggle('active', n === i));
    pill.style.opacity = i < 0 ? '0' : '1';
    if (i >= 0) pill.style.setProperty('--i', i);
  }
  slider.addEventListener('input', () => render(Number(slider.value)));
  segBtns.forEach((b) => b.addEventListener('click', () => {
    slider.value = b.dataset.v;
    render(Number(b.dataset.v));
  }));
  render(100);

  /* ===== Switches ===== */
  document.querySelectorAll('.switch').forEach((s) => {
    s.onclick = () => s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true');
  });
</script>
</body>
</html>
