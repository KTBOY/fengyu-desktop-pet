<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>人脸识别照采集</title>
<meta name="description" content="校园人脸识别照片采集与适配性检测">
<style>
  :root {
    /* ===== 设计令牌 ===== */
    --primary: 231 52% 46%;             /* 深靛蓝 */
    --primary-deep: 233 56% 34%;
    --primary-soft: 231 60% 95%;
    --primary-fg: 0 0% 100%;
    --success: 152 55% 38%;
    --success-soft: 152 50% 94%;
    --danger: 4 72% 52%;
    --danger-soft: 4 80% 96%;
    --warn: 38 90% 48%;
    --ink: 232 22% 16%;
    --ink-2: 231 12% 42%;
    --ink-3: 230 10% 64%;
    --line: 230 20% 91%;
    --surface: 0 0% 100%;
    --page-bg: 228 33% 96.5%;

    --grad-id-card: linear-gradient(150deg, hsl(233 56% 30%) 0%, hsl(231 52% 44%) 58%, hsl(228 55% 55%) 100%);
    --grad-cta: linear-gradient(150deg, hsl(231 52% 50%), hsl(233 56% 38%));

    --shadow-card: 0 2px 10px hsl(231 40% 40% / .07);
    --shadow-id: 0 14px 34px hsl(233 56% 34% / .32);
    --shadow-cta: 0 8px 20px hsl(231 52% 46% / .32);
    --shadow-sheet: 0 -10px 36px hsl(232 40% 25% / .16);

    --r-xl: 22px;
    --r-lg: 16px;
    --r-md: 12px;
    --r-sm: 8px;
    --ease: cubic-bezier(.32,.72,.24,1);
    --transition: all .22s var(--ease);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: hsl(226 18% 88%);
    color: hsl(var(--ink));
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: hsl(var(--page-bg));
    position: relative;
    overflow-x: hidden;
    box-shadow: 0 0 40px hsl(228 30% 40% / .22);
    padding-bottom: 40px;
  }

  /* ===== 状态栏 / 导航 ===== */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px 2px;
    font-size: 15px;
    font-weight: 600;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { display: block; fill: hsl(var(--ink)); }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 50px;
  }
  .nav-back {
    position: absolute;
    left: 8px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: hsl(var(--ink));
    border-radius: 50%;
    transition: var(--transition);
  }
  .nav-back:active { background: hsl(var(--ink) / .08); }
  .nav-title { font-size: 17.5px; font-weight: 700; letter-spacing: .5px; }
  .nav-more {
    position: absolute;
    right: 8px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: hsl(var(--ink));
    border-radius: 50%;
    transition: var(--transition);
  }
  .nav-more:active { background: hsl(var(--ink) / .08); }

  /* ===== 证件卡（签名元素） ===== */
  .id-card {
    margin: 10px 16px 0;
    border-radius: var(--r-xl);
    background: var(--grad-id-card);
    color: hsl(var(--primary-fg));
    padding: 20px 20px 18px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-id);
  }
  /* 卡面纹理：同心圆弧，呼应人脸扫描 */
  .id-card::before {
    content: "";
    position: absolute;
    right: -70px; top: -70px;
    width: 240px; height: 240px;
    border-radius: 50%;
    border: 1.5px solid hsl(0 0% 100% / .14);
    box-shadow: 0 0 0 34px hsl(0 0% 100% / .05), 0 0 0 72px hsl(0 0% 100% / .04);
    pointer-events: none;
  }
  /* 挂绳孔 */
  .id-card::after {
    content: "";
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 7px;
    border-radius: 99px;
    background: hsl(233 56% 22% / .55);
    box-shadow: inset 0 1px 2px hsl(0 0% 0% / .4);
  }

  .id-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .id-school {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; letter-spacing: 1px;
    opacity: .92;
  }
  .id-school .logo {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: hsl(0 0% 100% / .16);
    display: flex; align-items: center; justify-content: center;
  }
  .badge-ok {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 600;
    color: hsl(150 70% 80%);
    background: hsl(152 55% 30% / .45);
    border: 1px solid hsl(150 60% 60% / .45);
    padding: 4px 10px;
    border-radius: 99px;
  }
  .badge-ok .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: hsl(150 70% 62%);
    box-shadow: 0 0 6px hsl(150 70% 62%);
  }

  .id-body { display: flex; gap: 18px; align-items: center; position: relative; }
  .id-photo {
    width: 96px;
    aspect-ratio: 3 / 4;
    border-radius: var(--r-md);
    background: linear-gradient(180deg, hsl(228 45% 88%), hsl(228 35% 78%));
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid hsl(0 0% 100% / .55);
    box-shadow: 0 6px 16px hsl(233 56% 20% / .35);
  }
  .id-photo svg { display: block; width: 100%; height: 100%; }

  .id-info { flex: 1; min-width: 0; }
  .id-info .name { font-size: 21px; font-weight: 700; letter-spacing: 2px; }
  .id-info .meta {
    margin-top: 7px;
    font-size: 12.5px;
    line-height: 1.9;
    opacity: .78;
  }
  .id-info .meta span { display: block; }
  .id-time {
    margin-top: 10px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px;
    opacity: .62;
  }

  /* ===== 操作区 ===== */
  .action-row {
    display: flex;
    gap: 12px;
    margin: 16px 16px 0;
  }
  .btn-cta {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px;
    font-size: 16.5px; font-weight: 700; letter-spacing: 2px;
    color: hsl(var(--primary-fg));
    background: var(--grad-cta);
    border: none;
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-cta);
    transition: var(--transition);
  }
  .btn-cta:active { transform: scale(.97); box-shadow: 0 3px 8px hsl(231 52% 46% / .28); }
  .btn-ghost {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 15px 18px;
    font-size: 14.5px; font-weight: 600;
    color: hsl(var(--primary));
    background: hsl(var(--surface));
    border: 1px solid hsl(var(--primary) / .3);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    transition: var(--transition);
  }
  .btn-ghost:active { background: hsl(var(--primary-soft)); }

  /* ===== 检测卡片 ===== */
  .panel {
    background: hsl(var(--surface));
    margin: 16px 16px 0;
    border-radius: var(--r-xl);
    padding: 20px 16px 14px;
    box-shadow: var(--shadow-card);
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px;
    margin-bottom: 4px;
  }
  .panel-title { font-size: 16.5px; font-weight: 700; }
  .link {
    display: inline-flex; align-items: center; gap: 3px;
    color: hsl(var(--primary));
    font-size: 13.5px; font-weight: 500;
    background: none; border: none;
    transition: var(--transition);
  }
  .link:active { opacity: .6; }

  .tip {
    display: flex; gap: 8px;
    margin: 10px 4px 14px;
    font-size: 12.5px;
    line-height: 1.7;
    color: hsl(var(--ink-2));
  }
  .tip svg { flex-shrink: 0; margin-top: 2px; }

  /* 分段切换：照片 ① ② ③ */
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: hsl(228 30% 94%);
    border-radius: var(--r-md);
    padding: 4px;
    margin-bottom: 6px;
  }
  .seg-btn {
    padding: 9px 0;
    font-size: 14px; font-weight: 600;
    color: hsl(var(--ink-2));
    background: none;
    border: none;
    border-radius: 9px;
    transition: var(--transition);
  }
  .seg-btn.active {
    color: hsl(var(--primary));
    background: hsl(var(--surface));
    box-shadow: 0 2px 8px hsl(231 40% 40% / .12);
  }

  /* 汇总条 */
  .summary {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 6px;
    font-size: 12.5px;
    color: hsl(var(--ink-2));
  }
  .summary b { font-size: 15px; color: hsl(var(--ink)); margin-right: 2px; }
  .summary .s-ok b { color: hsl(var(--success)); }
  .summary .s-bad b { color: hsl(var(--danger)); }

  /* 场景状态列表 */
  .scene-list { list-style: none; }
  .scene-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 6px;
    border-top: 1px solid hsl(var(--line));
    animation: rowIn .3s var(--ease) both;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .scene-name {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 500;
  }
  .scene-name .ico {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: hsl(var(--primary-soft));
    color: hsl(var(--primary));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .chip {
    font-size: 12.5px; font-weight: 600;
    padding: 4px 11px;
    border-radius: 99px;
  }
  .chip.ok   { color: hsl(var(--success)); background: hsl(var(--success-soft)); }
  .chip.bad  { color: hsl(var(--danger)); background: hsl(var(--danger-soft)); }
  .chip.none { color: hsl(var(--ink-3)); background: hsl(228 25% 94%); }
  .chip.ing  { color: hsl(var(--warn)); background: hsl(40 100% 94%); }
  .chip.ing::after {
    content: "";
    display: inline-block;
    width: 8px;
    text-align: left;
    animation: dots 1.5s steps(3) infinite;
  }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } }

  .expand-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%;
    padding: 12px 0 6px;
    border: none;
    border-top: 1px solid hsl(var(--line));
    background: none;
    color: hsl(var(--ink-2));
    font-size: 13.5px;
    transition: var(--transition);
  }
  .expand-btn:active { opacity: .55; }
  .expand-btn svg { transition: transform .25s var(--ease); }
  .expand-btn.open svg { transform: rotate(180deg); }
  .scene-item.extra { display: none; }
  .scene-list.expanded .scene-item.extra { display: flex; }

  /* ===== 底部操作面板 ===== */
  .sheet-mask {
    position: fixed; inset: 0;
    background: hsl(232 30% 10% / .48);
    opacity: 0; pointer-events: none;
    transition: opacity .26s ease;
    z-index: 40;
  }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%; bottom: 0;
    transform: translate(-50%, 105%);
    width: 100%; max-width: 430px;
    background: hsl(var(--surface));
    border-radius: 24px 24px 0 0;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-sheet);
    visibility: hidden;
    transition: transform .32s var(--ease), visibility 0s .32s;
    z-index: 50;
  }
  .sheet.show { transform: translate(-50%, 0); visibility: visible; transition-delay: 0s; }

  .sheet-handle {
    width: 38px; height: 4.5px;
    border-radius: 99px;
    background: hsl(228 15% 86%);
    margin: 4px auto 14px;
  }
  .sheet-title {
    font-size: 16px; font-weight: 700;
    padding: 0 6px 12px;
  }
  .sheet-item {
    display: flex; align-items: center; gap: 13px;
    width: 100%;
    padding: 13px 8px;
    background: none;
    border: none;
    border-radius: var(--r-md);
    font-size: 15.5px; font-weight: 500;
    color: hsl(var(--ink));
    text-align: left;
    transition: var(--transition);
  }
  .sheet-item:active { background: hsl(228 30% 95%); }
  .sheet-item .s-ico {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: hsl(var(--primary-soft));
    color: hsl(var(--primary));
    flex-shrink: 0;
  }
  .sheet-item .s-sub {
    display: block;
    font-size: 12px; font-weight: 400;
    color: hsl(var(--ink-3));
    margin-top: 2px;
  }
  .sheet-item.danger { color: hsl(var(--danger)); }
  .sheet-item.danger .s-ico { background: hsl(var(--danger-soft)); color: hsl(var(--danger)); }
  .sheet-cancel {
    width: 100%;
    margin-top: 8px;
    padding: 13px;
    font-size: 15.5px; font-weight: 600;
    color: hsl(var(--ink-2));
    background: hsl(228 30% 95%);
    border: none;
    border-radius: var(--r-md);
    transition: var(--transition);
  }
  .sheet-cancel:active { background: hsl(228 25% 90%); }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(10px);
    background: hsl(232 18% 20% / .92);
    color: #fff;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 99px;
    opacity: 0; pointer-events: none;
    transition: var(--transition);
    z-index: 60;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span id="clock">13:52</span>
    <span class="status-icons">
      <svg width="17" height="12" viewBox="0 0 18 13"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 17 13"><path d="M8.5 13 5.6 9.9a4.3 4.3 0 0 1 5.8 0Zm4.4-4.7a6.9 6.9 0 0 0-8.8 0L2.2 6.2a9.7 9.7 0 0 1 12.6 0ZM17 4.1a12.5 12.5 0 0 0-17 0l1.9 2a9.7 9.7 0 0 1 13.2 0Z"/></svg>
      <svg width="23" height="11" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1.2"/><rect x="22" y="3.5" width="2" height="5" rx="1"/></svg>
    </span>
  </div>

  <header class="nav-bar">
    <button class="nav-back" aria-label="返回" onclick="toast('返回上一页')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
    </button>
    <h1 class="nav-title">人脸识别照采集</h1>
    <button class="nav-more" aria-label="更多功能" onclick="openSheet()">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <!-- 校园数字证件卡 -->
  <section class="id-card" aria-label="已采集照片">
    <div class="id-head">
      <span class="id-school">
        <span class="logo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 6-10 6L2 9Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
        </span>
        校园通行 · 数字证件
      </span>
      <span class="badge-ok"><span class="dot"></span>采集成功</span>
    </div>
    <div class="id-body">
      <div class="id-photo">
        <!-- 内置头像占位（SVG，无需图片资源） -->
        <svg viewBox="0 0 96 128" role="img" aria-label="证件照">
          <rect width="96" height="128" fill="hsl(226 40% 90%)"/>
          <circle cx="48" cy="46" r="21" fill="hsl(228 22% 62%)"/>
          <path d="M10 128c0-24 17-38 38-38s38 14 38 38Z" fill="hsl(228 22% 62%)"/>
        </svg>
      </div>
      <div class="id-info">
        <div class="name">周同学</div>
        <div class="meta">
          <span>学号 2023214081</span>
          <span>信息工程学院</span>
        </div>
        <span class="id-time">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          采集于 2026-07-28 13:52
        </span>
      </div>
    </div>
  </section>

  <!-- 主操作 -->
  <div class="action-row">
    <button class="btn-cta" onclick="toast('正在调起摄像头采集…')">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h1.6a2 2 0 0 0 1.7-1l.7-1.2A2 2 0 0 1 10.7 3h2.6a2 2 0 0 1 1.7.9l.7 1.2a2 2 0 0 0 1.7 1H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      重新采集
    </button>
    <button class="btn-ghost" onclick="toast('查看采集要求')">
      采集要求
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </div>

  <!-- 适配性检测 -->
  <section class="panel">
    <div class="panel-head">
      <h2 class="panel-title">照片适配性检测</h2>
      <button class="link" onclick="toast('查看使用授权')">
        使用授权
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
    <p class="tip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="hsl(231 52% 46%)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      列表仅表示照片的人脸识别适配性情况，实际通行权限视各场景管理而定；若提示未检测，可在右上角"更多功能"中提交检测。
    </p>

    <div class="seg" role="tablist" aria-label="选择照片">
      <button class="seg-btn active" role="tab" onclick="switchPhoto(0, this)">照片 ①</button>
      <button class="seg-btn" role="tab" onclick="switchPhoto(1, this)">照片 ②</button>
      <button class="seg-btn" role="tab" onclick="switchPhoto(2, this)">照片 ③</button>
    </div>

    <div class="summary" id="summary"></div>
    <ul class="scene-list" id="sceneList"></ul>
    <button class="expand-btn" id="expandBtn" onclick="toggleExpand()">
      <span id="expandText">展开全部 10 个场景</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </section>
</div>

<!-- 更多功能面板 -->
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="更多功能">
  <div class="sheet-handle"></div>
  <div class="sheet-title">更多功能</div>
  <button class="sheet-item" onclick="sheetAction('采集照片')">
    <span class="s-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h1.6a2 2 0 0 0 1.7-1l.7-1.2A2 2 0 0 1 10.7 3h2.6a2 2 0 0 1 1.7.9l.7 1.2a2 2 0 0 0 1.7 1H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
    <span>采集照片<span class="s-sub">拍摄新的人脸识别照片</span></span>
  </button>
  <button class="sheet-item" onclick="sheetAction('提交检测')">
    <span class="s-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="m9 12 2.5 2.5L21 5"/></svg></span>
    <span>提交检测<span class="s-sub">对未检测照片发起适配性检测</span></span>
  </button>
  <button class="sheet-item" onclick="sheetAction('照片申诉')">
    <span class="s-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/><path d="M12 7v4"/><path d="M12 14h.01"/></svg></span>
    <span>照片申诉<span class="s-sub">对检测结果有异议时发起申诉</span></span>
  </button>
  <button class="sheet-item danger" onclick="deletePhoto()">
    <span class="s-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg></span>
    <span>删除照片<span class="s-sub">删除后需重新采集</span></span>
  </button>
  <button class="sheet-cancel" onclick="closeSheet()">取消</button>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ===== 数据 ===== */
  const SCENES = [
    { name: '图书馆',   icon: 'M4 19V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5V19a2 2 0 0 0 2 2h13' },
    { name: '校门',     icon: 'M3 21V8l9-5 9 5v13M9 21v-8h6v8M3 21h18' },
    { name: '宿舍',     icon: 'M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1' },
    { name: '体育馆',   icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 0 0 0 18M12 3a14 14 0 0 1 0 18' },
    { name: '实验楼',   icon: 'M10 3v6L4.7 18a2 2 0 0 0 1.8 3h11a2 2 0 0 0 1.8-3L14 9V3M8 3h8' },
    { name: '羽毛球馆', icon: 'M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12ZM12 18v3M8.5 20h7' },
    { name: '教学楼',   icon: 'M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M4 21h16M9 8h1M9 12h1M14 8h1M14 12h1M11 21v-4h2v4', extra: true },
    { name: '食堂',     icon: 'M5 3v18M5 8c2 0 3-1.5 3-4M5 8c-2 0-3-1.5-3-4M14 3v18M14 11h4a1 1 0 0 0 1-1V6a3 3 0 0 0-3-3', extra: true },
    { name: '游泳馆',   icon: 'M2 18c1.5 1.2 3.5 1.2 5 0s3.5-1.2 5 0 3.5 1.2 5 0 3.5-1.2 5 0M2 13c1.5 1.2 3.5 1.2 5 0s3.5-1.2 5 0 3.5 1.2 5 0 3.5-1.2 5 0M8 10V5a2 2 0 0 1 4 0', extra: true },
    { name: '报告厅',   icon: 'M4 4h16v11H4zM8 21l4-4 4 4M12 15v2', extra: true },
  ];
  /* 每张照片在 10 个场景中的状态：ok/bad/none/ing */
  const PHOTO_STATUS = [
    ['ok','ok','ok','ok','ok','ok','ok','ok','none','ok'],
    ['bad','bad','bad','bad','bad','bad','bad','ing','bad','bad'],
    ['none','ing','none','ing','none','ing','none','none','ing','none'],
  ];
  const CHIP_TEXT = { ok: '适配', bad: '不适配', none: '未检测', ing: '检测中' };

  let current = 0;
  let expanded = false;

  function render() {
    const list = document.getElementById('sceneList');
    const status = PHOTO_STATUS[current];
    list.innerHTML = SCENES.map((s, i) => `
      <li class="scene-item${s.extra ? ' extra' : ''}" style="animation-delay:${i * 30}ms">
        <span class="scene-name">
          <span class="ico">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${s.icon}"/></svg>
          </span>
          ${s.name}
        </span>
        <span class="chip ${status[i]}">${CHIP_TEXT[status[i]]}</span>
      </li>`).join('');
    list.classList.toggle('expanded', expanded);

    const c = { ok: 0, bad: 0, none: 0, ing: 0 };
    status.forEach(s => c[s]++);
    document.getElementById('summary').innerHTML = `
      <span class="s-ok"><b>${c.ok}</b>适配</span>
      <span class="s-bad"><b>${c.bad}</b>不适配</span>
      <span><b>${c.none + c.ing}</b>待检测</span>`;
  }

  function switchPhoto(i, btn) {
    current = i;
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function toggleExpand() {
    expanded = !expanded;
    document.getElementById('expandBtn').classList.toggle('open', expanded);
    document.getElementById('expandText').textContent = expanded ? '收起' : '展开全部 10 个场景';
    render();
  }

  /* ===== 面板 / Toast ===== */
  const sheet = document.getElementById('sheet');
  const mask = document.getElementById('sheetMask');
  function openSheet() { sheet.classList.add('show'); mask.classList.add('show'); }
  function closeSheet() { sheet.classList.remove('show'); mask.classList.remove('show'); }
  function sheetAction(name) { closeSheet(); toast(name + '：功能演示'); }
  function deletePhoto() {
    closeSheet();
    setTimeout(() => {
      if (confirm('确定要删除已采集的照片吗？删除后需重新采集。')) toast('照片已删除');
    }, 250);
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 15000);

  render();
</script>
</body>
</html>
