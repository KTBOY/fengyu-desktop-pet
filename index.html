<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>穗穗桌面精灵</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      display: block;
      cursor: grab;
    }
    #stage:active { cursor: grabbing; }
    #bubble {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      max-width: 300px;
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--bubble-bg, rgba(255, 252, 245, 0.96));
      border: 1.5px solid var(--primary, #d9b45c);
      color: var(--ink, #6b4a1f);
      font: 14px/1.35 "Microsoft YaHei", sans-serif;
      box-shadow: 0 2px 10px rgba(120, 90, 20, 0.25);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      text-align: center;
      /* 最多 2 行，超出以省略号收尾；避免过窄时挤成多行并溢出到人物区 */
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      word-break: break-word;
    }
    #bubble.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="bubble"></div>
  <canvas id="stage"></canvas>
  <script src="character.js"></script>
  <script src="app.js"></script>
</body>
</html>
