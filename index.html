<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>凤羽桌面精灵</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      display: block;
      cursor: grab;
    }
    #stage:active { cursor: grabbing; }
    #bubble {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 300px;
      padding: 8px 14px;
      border-radius: 14px;
      background: rgba(255, 252, 245, 0.96);
      border: 1.5px solid #d9b45c;
      color: #6b4a1f;
      font: 14px/1.5 "Microsoft YaHei", sans-serif;
      box-shadow: 0 2px 10px rgba(120, 90, 20, 0.25);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }
    #bubble.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="bubble"></div>
  <canvas id="stage"></canvas>
  <script src="character.js"></script>
  <script src="app.js"></script>
</body>
</html>
