<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>共鸣终端</title>
  <style>
    /* ==========================================================
       Resonance HUD 设计语言（已抽成 skill：.qoder/skills/resonance-hud）
         金       #c9ac67   —— 品牌强调色，固定不随角色变
         米白     #fafae9   —— 正文/标题
         近黑底   #14161a ~ #1b1e23
       造型特征：纯直角、发丝级描边、HUD 角标、中文标题配大字距拉丁副标、
                 菱形节点、点阵括号。切角只用在自带边缘表达的小组件上。
       ========================================================== */
    :root {
      --gold: #c9ac67;
      --gold-bright: #e6cf95;
      --gold-dim: rgba(201, 172, 103, .3);
      --cream: #fafae9;
      --cream-dim: rgba(250, 250, 233, .45);

      --bg-0: #14161a;
      --bg-1: #1b1e23;
      --card: rgba(255, 255, 255, .035);
      --hair: rgba(201, 172, 103, .2);

      /* 角色主题色注入点：唯一允许随角色变化的槽位 */
      --theme: #d9b45c;

      --ease: cubic-bezier(.32,.72,.24,1);
      --latin: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      color: var(--cream);
      font: 14px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    body {
      position: relative;
      background:
        radial-gradient(130% 80% at 100% 0%, rgba(201, 172, 103, .11), transparent 62%),
        linear-gradient(168deg, var(--bg-1), var(--bg-0) 62%);
    }
    /* 斜向扫描纹理，极淡，只为质感 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(115deg,
        rgba(255, 255, 255, .022) 0 1px, transparent 1px 5px);
      pointer-events: none;
      z-index: 1;
    }
    /* 顶部金色细光边 */
    body::after {
      content: '';
      position: fixed; left: 0; right: 0; top: 0; height: 1px;
      background: linear-gradient(90deg, var(--gold), rgba(201, 172, 103, .35));
      pointer-events: none;
      z-index: 3;
    }

    /* ====== 标题栏（无边框窗口拖动区） ====== */
    .titlebar {
      position: relative;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 8px 9px 16px;
      -webkit-app-region: drag;
      z-index: 2;
    }
    .diamond {
      width: 9px; height: 9px; flex: none;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(201, 172, 103, .7);
    }
    .titlebar .tt { flex: 1; line-height: 1.15; }
    .titlebar .tt b { font-size: 12.5px; font-weight: 600; letter-spacing: 1px; }
    .titlebar .tt i {
      display: block; font-style: normal;
      font: 400 8.5px/1 var(--latin);
      letter-spacing: 2.4px; color: var(--gold-dim);
      margin-top: 2px;
    }
    .titlebar .close {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: var(--cream-dim);
      transition: all .15s var(--ease);
      -webkit-app-region: no-drag;
    }
    .titlebar .close:hover { color: #ff6b5e; background: rgba(255, 107, 94, .12); }

    .wrap { position: relative; padding: 0 16px 14px; z-index: 2; }

    /* ====== 头部：角色名 + 拉丁副标 + 状态 ====== */
    .head { padding: 2px 2px 14px; }
    .head h1 { font-size: 24px; font-weight: 700; letter-spacing: 3px; line-height: 1.2; }
    .head .sub {
      font: 400 9px/1 var(--latin);
      letter-spacing: 3.4px; color: var(--gold);
      margin-top: 5px;
    }
    .head .state {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--cream-dim);
      margin-top: 9px;
    }
    .head .state s {
      width: 4px; height: 4px; background: #6ee7a0;
      transform: rotate(45deg); text-decoration: none;
      box-shadow: 0 0 6px #6ee7a0;
    }

    /* ====== 卡片：直角 + 发丝描边 + HUD 角标 ====== */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--hair);
      padding: 13px 14px;
      margin-bottom: 9px;
    }
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 9px; height: 9px;
      border-color: var(--gold);
      pointer-events: none;
    }
    .card::before { left: -1px; top: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .card::after { right: -1px; bottom: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* 卡片头：小方块 + 中文 + 横线 + 拉丁 */
    .card-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .card-head .mk { width: 3px; height: 12px; background: var(--gold); flex: none; }
    .card-head .zh { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; }
    .card-head .ln { flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-dim), transparent); }
    .card-head .en { font: 400 8.5px/1 var(--latin); letter-spacing: 2.2px; color: var(--gold-dim); }

    /* ====== 角色选择 ====== */
    /* 滚动容器会同时裁剪纵向内容：内边距给 hover 上移与阴影留空间，负 margin 抵消占位 */
    .gallery {
      display: flex; gap: 9px; overflow-x: auto;
      padding: 6px 4px 12px; margin: -6px -4px -12px;
      scrollbar-width: none;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .char {
      position: relative; flex: none;
      width: 84px; padding: 6px 6px 7px;
      background: rgba(0, 0, 0, .28);
      border: 1px solid rgba(255, 255, 255, .07);
      text-align: center;
      transition: all .2s var(--ease);
    }
    .char:hover { transform: translateY(-2px); border-color: rgba(201, 172, 103, .4); }
    .char.active {
      border-color: var(--gold);
      background: rgba(201, 172, 103, .1);
      box-shadow: 0 0 0 1px rgba(201, 172, 103, .25), 0 6px 18px rgba(0, 0, 0, .5);
    }
    /* 选中态四角 HUD 角标 */
    .char .cn { position: absolute; width: 7px; height: 7px; border-color: var(--gold-bright); opacity: 0; transition: opacity .2s; }
    .char.active .cn { opacity: 1; }
    .char .cn:nth-of-type(1) { left: -1px; top: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .char .cn:nth-of-type(2) { right: -1px; top: -1px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .char .cn:nth-of-type(3) { left: -1px; bottom: -1px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .char .cn:nth-of-type(4) { right: -1px; bottom: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    .char .thumb {
      height: 84px; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
      /* 底色用该角色自身主题色（--c 逐卡注入），不随全局换肤 */
      background:
        linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, .5)),
        linear-gradient(165deg, color-mix(in srgb, var(--c, var(--theme)) 32%, #12141a), #12141a);
    }
    .char img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
    .char .nm {
      font-size: 11.5px; letter-spacing: .5px; margin-top: 6px;
      color: var(--cream-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .char.active .nm { color: var(--cream); font-weight: 600; }

    /* ====== 大小：大号读数 + 菱形滑块 ====== */
    .val-row { display: flex; align-items: flex-end; justify-content: space-between; margin: -2px 0 2px; }
    #val {
      font: 700 32px/1 var(--latin);
      color: var(--gold-bright);
      letter-spacing: 1px;
      text-shadow: 0 0 18px rgba(201, 172, 103, .45);
    }
    #val small { font-size: 13px; margin-left: 2px; color: var(--gold-dim); }
    .val-row .hint { font: 400 8.5px/1 var(--latin); letter-spacing: 2px; color: var(--cream-dim); padding-bottom: 3px; }

    .slider-box { padding: 8px 0 4px; }
    input[type=range] {
      width: 100%; height: 22px;
      -webkit-appearance: none; background: transparent;
      cursor: pointer; display: block;
    }
    /* 注：track 上不能用 clip-path——会连菱形 thumb 一起裁掉 */
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      background:
        linear-gradient(90deg, var(--gold), var(--gold-bright)) 0/var(--pct, 58%) 100% no-repeat,
        rgba(255, 255, 255, .1);
    }
    /* 菱形滑块：12px 方块旋转后对角约 17px，靠 height:22px 容得下不被裁 */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      margin-top: -4px;
      background: var(--gold-bright);
      border: none;
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(201, 172, 103, .85);
      transition: box-shadow .12s var(--ease);
    }
    input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 16px rgba(230, 207, 149, 1); }

    .ticks {
      display: flex; justify-content: space-between;
      font: 400 9px/1 var(--latin); letter-spacing: 1.2px;
      color: var(--cream-dim);
      margin-top: 2px;
    }

    /* 预设（当前隐藏，去掉 HTML 里的 hidden 即可恢复） */
    .presets {
      position: relative;
      display: grid; grid-template-columns: repeat(4, 1fr);
      margin-top: 11px;
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(0, 0, 0, .25);
    }
    .presets .pill {
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 25%;
      background: rgba(201, 172, 103, .18);
      border-bottom: 1.5px solid var(--gold);
      transform: translateX(calc(var(--i, 2) * 100%));
      transition: transform .28s var(--ease), opacity .18s;
      pointer-events: none;
    }
    .presets button {
      position: relative;
      padding: 6px 0;
      font-size: 12.5px; letter-spacing: 1px;
      color: var(--cream-dim);
      transition: color .18s var(--ease);
    }
    .presets button:hover { color: var(--cream); }
    .presets button.active { color: var(--gold-bright); font-weight: 600; }

    /* ====== 特效开关 ====== */
    .switch-row { display: flex; align-items: center; gap: 11px; }
    .switch-row .ico {
      width: 34px; height: 34px; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold);
      background: rgba(201, 172, 103, .1);
      border: 1px solid var(--gold-dim);
      /* 左上右下切角：border 跟着 clip-path 一起被裁，自带勾边，不需额外补线 */
      clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    }
    .switch-row .txt { flex: 1; min-width: 0; }
    .switch-row .name { font-size: 13.5px; font-weight: 600; letter-spacing: 1px; }
    .switch-row .desc { font-size: 11px; color: var(--cream-dim); }
    .switch {
      position: relative; flex: none;
      width: 44px; height: 20px;
      background: rgba(0, 0, 0, .45);
      border: 1px solid rgba(255, 255, 255, .14);
      transition: all .2s var(--ease);
    }
    .switch::after {
      content: '';
      position: absolute; top: 2px; left: 2px;
      width: 16px; height: 14px;
      background: rgba(250, 250, 233, .5);
      transition: transform .2s var(--ease), background .2s;
      /* 拨杆斜切：实心色块，填色本身就是边缘 */
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
    }
    .switch[aria-checked="true"] {
      border-color: var(--gold);
      background: rgba(201, 172, 103, .2);
      box-shadow: 0 0 12px rgba(201, 172, 103, .3);
    }
    .switch[aria-checked="true"]::after {
      transform: translateX(22px);
      background: var(--gold-bright);
    }

    /* ====== 页脚：点阵括号 ====== */
    .foot {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      padding-top: 10px;
      font: 400 8.5px/1 var(--latin);
      letter-spacing: 2px;
      color: var(--cream-dim);
    }
    .foot .dots {
      display: grid;
      grid-template-columns: 2px 2px; grid-template-rows: 2px 2px 2px;
      gap: 1.5px;
      opacity: .55;
    }
    .foot .dots i { background: var(--gold); }
    .foot .dots.r { transform: scaleX(-1); }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <div class="titlebar">
    <span class="diamond"></span>
    <span class="tt">
      <b>共鸣终端</b>
      <i>RESONANCE TERMINAL</i>
    </span>
    <button id="closeBtn" class="close" aria-label="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>

  <div class="wrap">
    <div class="head">
      <h1 id="title">桌面精灵</h1>
      <div class="sub" id="subEn">RESONATOR / ACTIVE</div>
      <div class="state"><s></s>参数即时同步 · 自动写入配置</div>
    </div>

    <!-- 角色 -->
    <section class="card">
      <div class="card-head">
        <span class="mk"></span>
        <span class="zh">共鸣者</span>
        <span class="ln"></span>
        <span class="en">RESONATOR</span>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>

    <!-- 大小 -->
    <section class="card">
      <div class="card-head">
        <span class="mk"></span>
        <span class="zh">显形尺度</span>
        <span class="ln"></span>
        <span class="en">SCALE</span>
      </div>
      <div class="val-row">
        <span id="val">100<small>%</small></span>
        <span class="hint">30 — 150</span>
      </div>
      <div class="slider-box">
        <!-- step=1 连续拖动不跳格；setScale 经 rAF 节流，拖动不再逐事件轰炸主进程 -->
        <input id="scale" type="range" min="30" max="150" step="1" value="100" />
      </div>
      <div class="ticks"><span>30</span><span>90</span><span>150</span></div>
      <!-- 预设按钮暂隐藏（代码保留，去掉 hidden 即可恢复），大小调节只靠滑杆拖拽 -->
      <div class="presets" hidden>
        <span class="pill"></span>
        <button data-v="50">小</button>
        <button data-v="75">中</button>
        <button data-v="100">默认</button>
        <button data-v="130">大</button>
      </div>
    </section>

    <!-- 特效 -->
    <section class="card">
      <div class="switch-row">
        <span class="ico">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.9 2.6 2.5 4.2 5 5-2.5.8-4.1 2.4-5 5-.9-2.6-2.5-4.2-5-5 2.5-.8 4.1-2.4 5-5Z"/><path d="M5 15c.4 1.3 1.2 2.1 2.5 2.5C6.2 17.9 5.4 18.7 5 20c-.4-1.3-1.2-2.1-2.5-2.5C3.8 17.1 4.6 16.3 5 15Z"/></svg>
        </span>
        <span class="txt">
          <div class="name">星光特效</div>
          <div class="desc">人物周围环绕闪烁的星星</div>
        </span>
        <button id="fx" class="switch" role="switch" aria-checked="true" aria-label="星光特效"></button>
      </div>
    </section>

    <div class="foot">
      <span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      ESC TO CLOSE · DRAG TO MOVE
      <span class="dots r"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <script>
    const api = window.petAPI;
    const title = document.getElementById('title');
    const gallery = document.getElementById('gallery');
    const slider = document.getElementById('scale');
    const val = document.getElementById('val');
    const fx = document.getElementById('fx');
    const buttons = Array.from(document.querySelectorAll('.presets button'));
    const pill = document.querySelector('.presets .pill');

    document.getElementById('closeBtn').addEventListener('click', () => window.close());

    // ---------- 主题：角色色只注入 --theme，金色骨架固定不变 ----------
    function applyTheme(theme) {
      if (theme && theme.primary) document.documentElement.style.setProperty('--theme', theme.primary);
    }

    // ---------- 角色画廊 ----------
    let charList = [], currentSel = null;
    function highlight(id) {
      Array.from(gallery.children).forEach((n) => n.classList.toggle('active', n.dataset.id === id));
    }
    function renderGallery(list, curId) {
      gallery.innerHTML = '';
      list.forEach((c) => {
        const el = document.createElement('button');
        el.className = 'char' + (c.id === curId ? ' active' : '');
        el.dataset.id = c.id;
        // 缩略图底色固定为角色自身主题色，不随全局主题变
        if (c.theme && c.theme.primary) el.style.setProperty('--c', c.theme.primary);

        for (let i = 0; i < 4; i++) {
          const cn = document.createElement('span');
          cn.className = 'cn';
          el.appendChild(cn);
        }
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const img = document.createElement('img');
        img.src = c.imageDataURL || '';
        img.alt = c.name;
        thumb.appendChild(img);
        const nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = c.name;

        el.appendChild(thumb);
        el.appendChild(nm);
        el.addEventListener('click', () => {
          if (c.id === currentSel) return;
          currentSel = c.id;
          highlight(c.id);                       // 先本地即时高亮，主进程随后广播 character-changed 再确认换肤
          if (api) api.setCharacter(c.id);
        });
        gallery.appendChild(el);
      });
    }

    // ---------- 大小 ----------
    function render(pct) {
      val.innerHTML = pct + '<small>%</small>';
      slider.style.setProperty('--pct', ((pct - 30) / 120 * 100) + '%');
      // 命中预设值时 pill 滑到对应按钮，否则淡出（预设当前隐藏，逻辑保留）
      const idx = buttons.findIndex((b) => Number(b.dataset.v) === pct);
      buttons.forEach((b, i) => b.classList.toggle('active', i === idx));
      pill.style.opacity = idx < 0 ? '0' : '1';
      if (idx >= 0) pill.style.setProperty('--i', idx);
    }

    // rAF 节流：拖动时 UI 即时反馈，但发往主进程的 setScale 每帧最多一次
    // （主进程每次都要 setBounds 调窗口，逐事件发送是拖动卡顿的主因）
    let pendingScale = null, rafId = 0;
    function sendScale(pct) {
      pendingScale = pct;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = 0;
        if (api) api.setScale(pendingScale / 100);
      });
    }
    function apply(pct) {
      slider.value = pct;
      render(pct);
      sendScale(pct);
    }
    function applyEffects(on) {
      fx.setAttribute('aria-checked', on ? 'true' : 'false');
      if (api) api.setEffects(on);
    }

    slider.addEventListener('input', () => apply(Number(slider.value)));
    buttons.forEach((b) => b.addEventListener('click', () => apply(Number(b.dataset.v))));
    fx.addEventListener('click', () => applyEffects(fx.getAttribute('aria-checked') !== 'true'));
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });

    // ---------- 初始化：同步大小/特效 + 角色列表/当前角色 ----------
    if (api) {
      api.getSettings().then((cfg) => {
        const pct = Math.round(((cfg && cfg.scale) || 1) * 100);
        slider.value = pct;
        render(pct);
        fx.setAttribute('aria-checked', (!cfg || cfg.effects !== false) ? 'true' : 'false');
      });

      Promise.all([api.getCharacters(), api.getCurrentCharacter()]).then(([list, cur]) => {
        charList = list || [];
        currentSel = cur ? cur.id : (charList[0] && charList[0].id) || null;
        renderGallery(charList, currentSel);
        if (cur) { applyTheme(cur.theme); title.textContent = cur.name; }
      });

      if (api.onCharacterChanged) api.onCharacterChanged((c) => {
        if (!c) return;
        currentSel = c.id;
        highlight(c.id);
        applyTheme(c.theme);
        title.textContent = c.name;
      });
    }
  </script>
</body>
</html>
